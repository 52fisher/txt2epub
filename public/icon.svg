  <line x1="40" y1="74" x2="52" y2="74" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round"/>
  <!-- Text lines on right page -->
  <line x1="70" y1="44" x2="90" y2="44" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="54" x2="88" y2="54" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round"/>
